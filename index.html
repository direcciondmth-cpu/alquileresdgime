<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alquileres SIPROSA</title>
  
  <!-- FAVICON ACTUALIZADO CON LA IMAGEN PROPORCIONADA -->
  <link rel="icon" type="image/jpeg" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR63Km1cK7f1rtCkJYVNwWfpNYagVHr6y9KKesIGshxaBWtfIGXsmOdR5ga&s=10">
  
  <!-- Fuentes de Google para un estilo más moderno -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* VARIABLES DE COLOR Y ESTILO */
    :root {
      --brand: #0f4c5c;
      --brand-hover: #156276;
      --ink: #1e293b;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      
      /* Estados */
      --ok-bg: #dcfce7;
      --ok-text: #166534;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --warn-bg: #fef9c3;
      --warn-text: #854d0e;
      --info-bg: #e0f2fe;
      --info-text: #075985;
      --neutral-bg: #f1f5f9;
      --neutral-text: #475569;
      
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* CABECERA (HEADER) */
    header {
      background: linear-gradient(135deg, var(--brand), #1a3644);
      color: #fff;
      padding: 20px clamp(20px, 4vw, 50px);
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      box-shadow: var(--shadow-md);
    }
    
    .header-title {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 50%;
      background: #fff;
      padding: 3px;
      box-shadow: var(--shadow-sm);
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.5vw, 26px);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin: 4px 0 0;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 400;
    }

    /* BOTONES */
    .header-actions, .toolbar, .row-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background: var(--brand);
      color: #fff;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover { background: var(--brand-hover); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    
    button.secondary { background: #fff; color: var(--brand); border: 1px solid #cbd5e1; }
    button.secondary:hover { background: #f8fafc; }
    button.danger { background: #ef4444; color: #fff; }
    button.danger:hover { background: #dc2626; }

    /* CONTENEDOR PRINCIPAL */
    .shell {
      max-width: 1600px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* TARJETAS DE ESTADÍSTICAS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .stat:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .stat span {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
      color: var(--brand);
      font-weight: 700;
    }

    /* PANELES Y ALERTAS */
    .panel, .alerts {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      overflow: hidden;
    }
    
    .alerts { padding: 20px; }
    .alerts h2 { font-size: 18px; margin: 0 0 15px; color: var(--danger-text); }
    
    .alert-item {
      padding: 12px 16px;
      border-left: 4px solid #ef4444;
      background: #fef2f2;
      border-radius: 0 8px 8px 0;
      margin-bottom: 8px;
      font-size: 13px;
      color: #7f1d1d;
    }
    .alert-item:last-child { margin-bottom: 0; }
    .alert-item b { color: #991b1b; }

    /* BARRA DE HERRAMIENTAS (FILTROS) */
    .toolbar {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      background: #fdfdfd;
    }

    .toolbar input, .toolbar select {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      padding: 10px 14px;
      font-family: inherit;
      color: var(--ink);
      font-size: 13px;
      transition: border-color 0.2s;
    }
    
    .toolbar input:focus, .toolbar select:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 76, 92, 0.1);
    }

    .toolbar input { flex: 1; min-width: 250px; }
    
    #result { margin-left: auto; color: var(--text-muted); font-weight: 600; font-size: 13px; }

    /* TABLA */
    .table-wrap {
      overflow-x: auto;
      max-height: 65vh;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 1100px;
      text-align: left;
    }

    th {
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 14px 20px;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 13.5px;
    }

    tr { transition: background 0.1s; }
    tr:hover { background: #f1f5f9; }

    /* ESTADOS Y BADGES */
    .status {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    
    .VIGENTE, .COMPLETA { background: var(--ok-bg); color: var(--ok-text); }
    .VENCIDO, .INCOMPLETA { background: var(--danger-bg); color: var(--danger-text); }
    .PROXIMO, .DEMORADO { background: var(--warn-bg); color: var(--warn-text); }
    .SIN, .NO { background: var(--neutral-bg); color: var(--neutral-text); }
    .BAJA { background: #f3e8ff; color: #6b21a8; }
    .EN { background: var(--info-bg); color: var(--info-text); }

    .red { color: #ef4444; font-weight: 700; }

    /* MODAL (FORMULARIO) */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.show {
      display: flex;
      opacity: 1;
      animation: fadeIn 0.3s ease forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .dialog {
      width: min(1000px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow-lg);
      transform: scale(0.95);
      animation: scaleUp 0.3s ease forwards;
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); }
      to { transform: scale(1); }
    }

    .dialog h2 { margin: 0 0 20px; color: var(--brand); font-size: 22px; }

    .form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .form label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .form input, .form select, .form textarea {
      width: 100%;
      font-family: inherit;
      color: var(--ink);
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .form input:focus, .form select:focus, .form textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 76, 92, 0.1);
    }

    .form input:read-only { background: #f1f5f9; cursor: not-allowed; }
    .form textarea { min-height: 80px; resize: vertical; }
    
    .form .wide { grid-column: span 2; }
    .form .full { grid-column: 1 / -1; }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .form { grid-template-columns: repeat(2, 1fr); }
      .form .wide { grid-column: span 2; }
    }

    @media (max-width: 600px) {
      .shell { padding: 0 12px; margin-top: 15px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .form { grid-template-columns: 1fr; }
      .form .wide, .form .full { grid-column: auto; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar input, .toolbar select { min-width: 100%; }
      #result { margin-left: 0; text-align: right; }
      header { padding: 15px; justify-content: center; text-align: center; }
      .header-title { flex-direction: column; text-align: center; }
      .header-actions { justify-content: center; width: 100%; }
      .dialog { padding: 20px; }
    }

    /* IMPRESIÓN */
    @media print {
      header, .toolbar, .alerts, .row-actions, .modal { display: none !important; }
      body { background: #fff; }
      .shell { max-width: none; margin: 0; padding: 0; }
      .panel { border: 0; box-shadow: none; margin: 0; }
      .table-wrap { max-height: none; overflow: visible; }
      th { position: static; border-bottom: 2px solid #000; color: #000; }
      td { border-bottom: 1px solid #ccc; }
      .stats { grid-template-columns: repeat(3, 1fr); margin-bottom: 20px; }
      .stat { border: 1px solid #ccc; box-shadow: none; }
    }
  </style>
</head>
<body>
  
  <header>
    <div class="header-title">
      <!-- LOGO ACTUALIZADO CON LA IMAGEN PROPORCIONADA -->
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR63Km1cK7f1rtCkJYVNwWfpNYagVHr6y9KKesIGshxaBWtfIGXsmOdR5ga&s=10" alt="Logo SIPROSA" class="logo">
      <div>
        <h1>Alquileres SIPROSA</h1>
        <p>Dirección de Recursos Físicos · Control de inmuebles alquilados</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="secondary" onclick="loadApp()">↻ Refrescar</button>
      <button class="secondary" onclick="exportExcel()">⇩ Excel</button>
      <button class="secondary" onclick="window.print()">▣ PDF</button>
      <button onclick="openForm()">＋ Nuevo alquiler</button>
    </div>
  </header>

  <main class="shell">
    <section class="stats" id="stats"></section>
    
    <section class="alerts">
      <h2>Alertas abiertas</h2>
      <div id="alerts">Cargando…</div>
    </section>
    
    <section class="panel">
      <div class="toolbar">
        <input id="search" oninput="render()" placeholder="Buscar por servicio, domicilio, locador o expediente...">
        <select id="vigencia" onchange="render()">
          <option value="">Todas las vigencias</option>
          <option>VIGENTE</option>
          <option>PROXIMO VENCIMIENTO</option>
          <option>VENCIDO</option>
          <option>SIN FECHA</option>
        </select>
        <select id="administrativo" onchange="render()">
          <option value="">Todos los estados</option>
          <option>EN TRAMITE</option>
          <option>FALTA RESOLUCION</option>
          <option>BAJA</option>
          <option>SIN ESTADO</option>
        </select>
        <span id="result"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Servicio / Inmueble</th>
              <th>Expediente</th>
              <th>Locador</th>
              <th>Inicio</th>
              <th>Fin</th>
              <th>Monto mensual</th>
              <th>Vigencia</th>
              <th>Documentación</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal" id="modal">
    <div class="dialog">
      <h2 id="formTitle">Nuevo alquiler</h2>
      <form id="form" onsubmit="save(event)">
        <div class="form" id="fields"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary" onclick="closeForm()">Cancelar</button>
          <button type="submit">Guardar alquiler</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Pegá aquí la URL que termina en /exec al desplegar Code.gs como aplicación web.
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPo7UnDdlraNuv9Q3GyJ9a0eFmTbR91i1tV-buZZ8SDINnR0-1tzhwNjVJ09mJP-Is7A/exec';
    
    // ESTADO DE LA APP (NO MODIFICAR)
    const state = { alquileres: [], alertas: [], indicadores: {}, editing: null };
    const fields = [
      ['ID_ALQUILER','ID del alquiler','text',true],['N_EXPEDIENTE_RESOLUCION','Expediente / resolución','text'],['N_INTERNO','N° interno','number'],['SERVICIO','Servicio / área','text',false,'wide'],['TIPO_EFECTOR','Tipo de efector','text'],['DOMICILIO','Domicilio','text',false,'wide'],['LOCALIDAD','Localidad','text'],['LOCADOR','Locador','text',false,'wide'],['CUIT_LOCADOR','CUIT del locador','text'],['FECHA_INICIO','Fecha de inicio','date'],['FECHA_FIN','Fecha de fin','date'],['FRECUENCIA_AJUSTE','Frecuencia de ajuste','text'],['INDICE_AJUSTE','Índice de ajuste','text'],['MONTO_MENSUAL','Monto mensual','number'],['MONEDA','Moneda','select',false,'',['ARS','USD']],['IVA','IVA','select',false,'',['NO INFORMADO','A DEFINIR','INCLUIDO','NO INCLUIDO']],['ESTADO_ADMINISTRATIVO','Estado administrativo','select',false,'',['SIN ESTADO','EN TRAMITE','FALTA RESOLUCION','BAJA']],['DOCUMENTACION','Documentación','select',false,'',['PENDIENTE DE RELEVAR','INCOMPLETA','COMPLETA','NO REQUIERE']],['SEGUIMIENTO_EXPEDIENTE','Seguimiento de expediente','select',false,'',['PENDIENTE DE RELEVAR','AL DIA','EN TRAMITE','DEMORADO','CERRADO']],['LINK_DRIVE','Carpeta/archivo en Drive','url',false,'wide'],['OBSERVACIONES','Observaciones','textarea',false,'full'],['ACTIVO','Activo','select',false,'',['SI','NO']]
    ];
    
    // FUNCIONES AUXILIARES
    const esc = s => String(s ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
    const money = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));
    const shortDate = d => d ? String(d).slice(0,10).split('-').reverse().join('/') : '—';
    
    // COMUNICACIÓN CON APPS SCRIPT
    function api(action,payload={}) { 
        return new Promise((resolve,reject)=>{ 
            if(!SCRIPT_URL.startsWith('https://script.google.com')) return reject(new Error('Configurá SCRIPT_URL en index.html.')); 
            const cb='appsScriptCallback'+Date.now()+Math.floor(Math.random()*9999); 
            const script=document.createElement('script'); 
            window[cb]=res=>{cleanup();res.ok?resolve(res.data):reject(new Error(res.error||'Error de Apps Script'));}; 
            const cleanup=()=>{delete window[cb];script.remove();}; 
            script.onerror=()=>{cleanup();reject(new Error('No se pudo conectar con Apps Script.'));}; 
            const json=JSON.stringify(payload); 
            const encoded=btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); 
            script.src=`${SCRIPT_URL}?action=${encodeURIComponent(action)}&prefix=${cb}&payload=${encoded}`; 
            document.body.appendChild(script); 
        }); 
    }
    
    async function loadApp(){ 
        try{
            document.getElementById('result').textContent='Actualizando…'; 
            await api('alerts'); 
            const data=await api('bootstrap'); 
            Object.assign(state,data); 
            renderStats();renderAlerts();render();
        }catch(e){
            alert(e.message);document.getElementById('result').textContent='Error de conexión';
        } 
    }
    
    function renderStats(){
        const s=state.indicadores; 
        const cards=[['Registros activos',s.total],['Vigentes',s.vigentes],['Próximos (90 días)',s.proximos],['Vencidos',s.vencidos],['Doc. pendientes',s.pendientes],['Monto vigente',money(s.monto)]];
        document.getElementById('stats').innerHTML=cards.map(([a,b])=>`<article class="stat"><span>${a}</span><strong>${b??0}</strong></article>`).join('');
    }
    
    function renderAlerts(){
        const list=state.alertas||[];
        document.getElementById('alerts').innerHTML=list.length?list.slice(0,10).map(a=>`<div class="alert-item"><b>${esc(a.PRIORIDAD)}</b> · ${esc(a.TIPO_ALERTA)} — ${esc(a.MENSAJE)} <small>(${esc(a.ID_ALQUILER)})</small></div>`).join(''):'<div style="color:var(--text-muted);font-size:13px">No hay alertas críticas en este momento.</div>';
    }
    
    function filtered(){
        const q=document.getElementById('search').value.trim().toLowerCase();
        const v=document.getElementById('vigencia').value;
        const a=document.getElementById('administrativo').value;
        return state.alquileres.filter(r=>r.ACTIVO==='SI'&&(!v||r.ESTADO_VIGENCIA===v)&&(!a||r.ESTADO_ADMINISTRATIVO===a)&&(!q||[r.SERVICIO,r.DOMICILIO,r.LOCADOR,r.N_EXPEDIENTE_RESOLUCION].join(' ').toLowerCase().includes(q)));
    }
    
    function badge(v){
        const c=String(v||'').split(' ')[0]; // Toma la primer palabra (PROXIMO, EN, etc) para aplicar estilo
        return `<span class="status ${c}">${esc(v||'SIN ESTADO')}</span>`;
    }
    
    function render(){
        const data=filtered();
        document.getElementById('result').textContent=`${data.length} registro(s)`;
        document.getElementById('rows').innerHTML=data.map(r=>`<tr>
            <td><b>${esc(r.SERVICIO)}</b><br><small style="color:var(--text-muted)">${esc(r.DOMICILIO||'Sin domicilio')}</small></td>
            <td>${esc(r.N_EXPEDIENTE_RESOLUCION||'—')}</td>
            <td>${esc(r.LOCADOR||'—')}</td>
            <td>${shortDate(r.FECHA_INICIO)}</td>
            <td>${shortDate(r.FECHA_FIN)}${Number(r.DIAS_PARA_VENCER)<0?'<br><small class="red">Vencido</small>':''}</td>
            <td style="font-weight:600">${money(r.MONTO_MENSUAL)}</td>
            <td>${badge(r.ESTADO_VIGENCIA||'SIN FECHA')}</td>
            <td>${badge(r.DOCUMENTACION||'PENDIENTE')}</td>
            <td>
                <div class="row-actions">
                    <button onclick="openForm('${r.ID_ALQUILER}')">Editar</button>
                    <button class="secondary" onclick="showHistory('${r.ID_ALQUILER}')">Historial</button>
                    <button class="danger" onclick="removeRecord('${r.ID_ALQUILER}')">Baja</button>
                </div>
            </td>
        </tr>`).join('')||'<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-muted)">No hay registros que coincidan con la búsqueda.</td></tr>';
    }
    
    function openForm(id){
        state.editing=id?state.alquileres.find(r=>r.ID_ALQUILER===id):{ACTIVO:'SI',MONEDA:'ARS',ESTADO_ADMINISTRATIVO:'SIN ESTADO',DOCUMENTACION:'PENDIENTE DE RELEVAR',SEGUIMIENTO_EXPEDIENTE:'PENDIENTE DE RELEVAR'};
        document.getElementById('formTitle').textContent=id?'Editar alquiler':'Nuevo alquiler';
        document.getElementById('fields').innerHTML=fields.map(([key,label,type,readonly,cls,options])=>{
            const val=state.editing[key]??'';
            const common=`name="${key}" ${readonly?'readonly':''}`;
            let control;
            if(type==='select')control=`<select ${common}>${options.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
            else if(type==='textarea')control=`<textarea ${common}>${esc(val)}</textarea>`;
            else control=`<input type="${type}" ${common} value="${esc(type==='date'?String(val).slice(0,10):val)}">`;
            return `<label class="${cls||''}">${label}${control}</label>`;
        }).join('');
        document.getElementById('modal').classList.add('show');
    }
    
    function closeForm(){
        document.getElementById('modal').classList.remove('show');
    }
    
    async function save(e){
        e.preventDefault();
        const form=new FormData(e.target);
        const record=Object.fromEntries(form.entries());
        record.N_INTERNO=record.N_INTERNO?Number(record.N_INTERNO):'';
        record.MONTO_MENSUAL=record.MONTO_MENSUAL?Number(record.MONTO_MENSUAL):'';
        const btn = e.target.querySelector('button[type="submit"]');
        btn.textContent = "Guardando..."; btn.disabled = true;
        try{
            await api('save',{record});
            closeForm();
            await api('alerts');
            await loadApp();
        }catch(err){
            alert(err.message);
        }finally {
            btn.textContent = "Guardar alquiler"; btn.disabled = false;
        }
    }
    
    async function removeRecord(id){
        if(!confirm('¿Dar de baja este alquiler? No se borra: queda en el historial.'))return;
        try{
            await api('delete',{id,observacion:'Baja solicitada desde el tablero'});
            await loadApp();
        }catch(err){
            alert(err.message);
        }
    }
    
    async function showHistory(id){
        try{
            const rows=await api('history',{id});
            const text=rows.length?rows.map(r=>`${r.FECHA_HORA} · ${r.OPERACION} · ${r.CAMPO}: ${r.VALOR_ANTERIOR||'—'} → ${r.VALOR_NUEVO||'—'}`).join('\n'):'Todavía no hay movimientos registrados.';
            alert(text);
        }catch(err){
            alert(err.message);
        }
    }
    
    function exportExcel(){
        const data=filtered();
        const cols=['ID_ALQUILER','N_EXPEDIENTE_RESOLUCION','SERVICIO','DOMICILIO','LOCADOR','FECHA_INICIO','FECHA_FIN','MONTO_MENSUAL','ESTADO_ADMINISTRATIVO','ESTADO_VIGENCIA','DOCUMENTACION'];
        const table=`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${data.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}</table>`;
        const blob=new Blob(['\ufeff<html><meta charset="utf-8">'+table+'</html>'],{type:'application/vnd.ms-excel'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='alquileres_siprosa.xls';
        a.click();
        URL.revokeObjectURL(a.href);
    }
    
    // Iniciar
    loadApp();
  </script>
</body>
</html>
