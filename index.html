<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alquileres SIPROSA</title>
  <style>
    :root{--ink:#173042;--brand:#0f4c5c;--teal:#1c7c7c;--bg:#f4f8fa;--line:#d9e4e8;--warn:#fff3bf;--danger:#ffe0e0;--ok:#d8f3dc;--card:#fff}*{box-sizing:border-box}body{margin:0;font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}header{background:linear-gradient(125deg,var(--brand),#133d55);color:#fff;padding:22px clamp(16px,4vw,52px);display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:clamp(22px,3vw,32px)}header p{margin:4px 0 0;opacity:.8}.header-actions,.toolbar{display:flex;gap:9px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:10px 13px;font:inherit;font-weight:650;cursor:pointer;background:var(--brand);color:#fff}button:hover{filter:brightness(1.08)}button.secondary{background:#e7f1f4;color:var(--brand)}button.danger{background:#b83232}.shell{max-width:1500px;margin:24px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:13px;margin-bottom:19px}.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px;box-shadow:0 1px 2px #1730420c}.stat span{display:block;color:#63808e;font-size:12px}.stat strong{display:block;font-size:25px;margin-top:5px}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px #1730420b}.toolbar{padding:14px;border-bottom:1px solid var(--line);align-items:center}.toolbar input,.toolbar select{border:1px solid #cbd9de;border-radius:8px;background:#fff;padding:10px;min-width:180px;font:inherit;color:var(--ink)}.toolbar input{flex:1;min-width:230px}#result{margin-left:auto;color:#647b86;font-weight:600}.table-wrap{overflow:auto;max-height:68vh}table{border-collapse:collapse;width:100%;min-width:1100px}th{background:#edf5f7;color:#24536a;font-size:11px;letter-spacing:.03em;text-align:left;position:sticky;top:0;z-index:1}th,td{padding:10px 11px;border-bottom:1px solid #e5edef;vertical-align:top}tr:hover td{background:#f7fbfc}.status{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.VIGENTE{background:var(--ok);color:#237239}.VENCIDO{background:var(--danger);color:#a12929}.PROXIMO{background:var(--warn);color:#795a00}.SIN{background:#edf0f2;color:#59646c}.BAJA{background:#ece4ff;color:#6540a4}.red{color:#b83232;font-weight:700}.row-actions{display:flex;gap:5px}.row-actions button{padding:6px 8px;font-size:12px}.modal{position:fixed;inset:0;background:#102a3699;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.dialog{width:min(1000px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 20px 60px #0005}.dialog h2{margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#426270}.form input,.form select,.form textarea{width:100%;font:inherit;color:var(--ink);padding:9px;border:1px solid #cbd9de;border-radius:7px;background:#fff}.form textarea{min-height:70px;resize:vertical}.form .wide{grid-column:span 2}.form .full{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:19px}.alerts{margin:20px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.alerts h2{font-size:17px;margin:0 0 9px}.alert-item{padding:8px 0;border-bottom:1px solid #edf1f3}.alert-item:last-child{border:0}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.form{grid-template-columns:repeat(2,1fr)}.form .wide{grid-column:span 2}}@media(max-width:560px){.shell{padding:0 10px;margin-top:12px}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.form .wide,.form .full{grid-column:auto}.toolbar input{min-width:100%}#result{margin-left:0;width:100%}header{padding:18px}.dialog{padding:16px}}
    @media print{header,.toolbar,.alerts,.row-actions,.modal{display:none!important}body{background:#fff}.shell{max-width:none;margin:0;padding:0}.panel{border:0;box-shadow:none}.table-wrap{max-height:none;overflow:visible}th{position:static}.stats{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <header><div><h1>Alquileres SIPROSA</h1><p>Dirección de Recursos Físicos · Control de inmuebles alquilados</p></div><div class="header-actions"><button class="secondary" onclick="loadApp()">↻ Refrescar</button><button class="secondary" onclick="exportExcel()">⇩ Excel</button><button class="secondary" onclick="window.print()">▣ PDF</button><button onclick="openForm()">＋ Nuevo alquiler</button></div></header>
  <main class="shell">
    <section class="stats" id="stats"></section>
    <section class="alerts"><h2>Alertas abiertas</h2><div id="alerts">Cargando…</div></section>
    <section class="panel"><div class="toolbar"><input id="search" oninput="render()" placeholder="Buscar por servicio, domicilio, locador o expediente"><select id="vigencia" onchange="render()"><option value="">Todas las vigencias</option><option>VIGENTE</option><option>PROXIMO VENCIMIENTO</option><option>VENCIDO</option><option>SIN FECHA</option></select><select id="administrativo" onchange="render()"><option value="">Todos los estados</option><option>EN TRAMITE</option><option>FALTA RESOLUCION</option><option>BAJA</option><option>SIN ESTADO</option></select><span id="result"></span></div><div class="table-wrap"><table><thead><tr><th>Servicio / inmueble</th><th>Expediente</th><th>Locador</th><th>Inicio</th><th>Fin</th><th>Monto mensual</th><th>Vigencia</th><th>Documentación</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  <div class="modal" id="modal"><div class="dialog"><h2 id="formTitle">Nuevo alquiler</h2><form id="form" onsubmit="save(event)"><div class="form" id="fields"></div><div class="dialog-actions"><button type="button" class="secondary" onclick="closeForm()">Cancelar</button><button type="submit">Guardar alquiler</button></div></form></div></div>
  <script>
    // Pegá aquí la URL que termina en /exec al desplegar Code.gs como aplicación web.
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPo7UnDdlraNuv9Q3GyJ9a0eFmTbR91i1tV-buZZ8SDINnR0-1tzhwNjVJ09mJP-Is7A/exec';
    const state = { alquileres: [], alertas: [], indicadores: {}, editing: null };
    const fields = [
      ['ID_ALQUILER','ID del alquiler','text',true],['N_EXPEDIENTE_RESOLUCION','Expediente / resolución','text'],['N_INTERNO','N° interno','number'],['SERVICIO','Servicio / área','text',false,'wide'],['TIPO_EFECTOR','Tipo de efector','text'],['DOMICILIO','Domicilio','text',false,'wide'],['LOCALIDAD','Localidad','text'],['LOCADOR','Locador','text',false,'wide'],['CUIT_LOCADOR','CUIT del locador','text'],['FECHA_INICIO','Fecha de inicio','date'],['FECHA_FIN','Fecha de fin','date'],['FRECUENCIA_AJUSTE','Frecuencia de ajuste','text'],['INDICE_AJUSTE','Índice de ajuste','text'],['MONTO_MENSUAL','Monto mensual','number'],['MONEDA','Moneda','select',false,'',['ARS','USD']],['IVA','IVA','select',false,'',['NO INFORMADO','A DEFINIR','INCLUIDO','NO INCLUIDO']],['ESTADO_ADMINISTRATIVO','Estado administrativo','select',false,'',['SIN ESTADO','EN TRAMITE','FALTA RESOLUCION','BAJA']],['DOCUMENTACION','Documentación','select',false,'',['PENDIENTE DE RELEVAR','INCOMPLETA','COMPLETA','NO REQUIERE']],['SEGUIMIENTO_EXPEDIENTE','Seguimiento de expediente','select',false,'',['PENDIENTE DE RELEVAR','AL DIA','EN TRAMITE','DEMORADO','CERRADO']],['LINK_DRIVE','Carpeta/archivo en Drive','url',false,'wide'],['OBSERVACIONES','Observaciones','textarea',false,'full'],['ACTIVO','Activo','select',false,'',['SI','NO']]
    ];
    const esc = s => String(s ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
    const money = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));
    const shortDate = d => d ? String(d).slice(0,10).split('-').reverse().join('/') : '—';
    function api(action,payload={}) { return new Promise((resolve,reject)=>{ if(!SCRIPT_URL.startsWith('https://script.google.com')) return reject(new Error('Configurá SCRIPT_URL en index.html.')); const cb='appsScriptCallback'+Date.now()+Math.floor(Math.random()*9999); const script=document.createElement('script'); window[cb]=res=>{cleanup();res.ok?resolve(res.data):reject(new Error(res.error||'Error de Apps Script'));}; const cleanup=()=>{delete window[cb];script.remove();}; script.onerror=()=>{cleanup();reject(new Error('No se pudo conectar con Apps Script.'));}; const json=JSON.stringify(payload); const encoded=btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); script.src=`${SCRIPT_URL}?action=${encodeURIComponent(action)}&prefix=${cb}&payload=${encoded}`; document.body.appendChild(script); }); }
    async function loadApp(){ try{document.getElementById('result').textContent='Actualizando…'; await api('alerts'); const data=await api('bootstrap'); Object.assign(state,data); renderStats();renderAlerts();render();}catch(e){alert(e.message);document.getElementById('result').textContent='Error de conexión';} }
    function renderStats(){const s=state.indicadores; const cards=[['Registros activos',s.total],['Vigentes',s.vigentes],['Próximos (90 días)',s.proximos],['Vencidos',s.vencidos],['Doc. pendientes',s.pendientes],['Monto vigente',money(s.monto)]];document.getElementById('stats').innerHTML=cards.map(([a,b])=>`<article class="stat"><span>${a}</span><strong>${b??0}</strong></article>`).join('');}
    function renderAlerts(){const list=state.alertas||[];document.getElementById('alerts').innerHTML=list.length?list.slice(0,10).map(a=>`<div class="alert-item"><b>${esc(a.PRIORIDAD)}</b> · ${esc(a.TIPO_ALERTA)} — ${esc(a.MENSAJE)} <small>(${esc(a.ID_ALQUILER)})</small></div>`).join(''):'No hay alertas abiertas.';}
    function filtered(){const q=document.getElementById('search').value.trim().toLowerCase();const v=document.getElementById('vigencia').value;const a=document.getElementById('administrativo').value;return state.alquileres.filter(r=>r.ACTIVO==='SI'&&(!v||r.ESTADO_VIGENCIA===v)&&(!a||r.ESTADO_ADMINISTRATIVO===a)&&(!q||[r.SERVICIO,r.DOMICILIO,r.LOCADOR,r.N_EXPEDIENTE_RESOLUCION].join(' ').toLowerCase().includes(q)));}
    function badge(v){const c=v.startsWith('PROXIMO')?'PROXIMO':v.startsWith('SIN')?'SIN':v;return `<span class="status ${c}">${esc(v||'SIN ESTADO')}</span>`;}
    function render(){const data=filtered();document.getElementById('result').textContent=`${data.length} registro(s)`;document.getElementById('rows').innerHTML=data.map(r=>`<tr><td><b>${esc(r.SERVICIO)}</b><br><small>${esc(r.DOMICILIO||'Sin domicilio')}</small></td><td>${esc(r.N_EXPEDIENTE_RESOLUCION||'—')}</td><td>${esc(r.LOCADOR||'—')}</td><td>${shortDate(r.FECHA_INICIO)}</td><td>${shortDate(r.FECHA_FIN)}${Number(r.DIAS_PARA_VENCER)<0?'<br><small class="red">Vencido</small>':''}</td><td>${money(r.MONTO_MENSUAL)}</td><td>${badge(r.ESTADO_VIGENCIA||'SIN FECHA')}</td><td>${badge(r.DOCUMENTACION||'PENDIENTE')}</td><td><div class="row-actions"><button onclick="openForm('${r.ID_ALQUILER}')">Editar</button><button class="secondary" onclick="showHistory('${r.ID_ALQUILER}')">Historial</button><button class="danger" onclick="removeRecord('${r.ID_ALQUILER}')">Baja</button></div></td></tr>`).join('')||'<tr><td colspan="9">No hay registros con esos filtros.</td></tr>';}
    function openForm(id){state.editing=id?state.alquileres.find(r=>r.ID_ALQUILER===id):{ACTIVO:'SI',MONEDA:'ARS',ESTADO_ADMINISTRATIVO:'SIN ESTADO',DOCUMENTACION:'PENDIENTE DE RELEVAR',SEGUIMIENTO_EXPEDIENTE:'PENDIENTE DE RELEVAR'};document.getElementById('formTitle').textContent=id?'Editar alquiler':'Nuevo alquiler';document.getElementById('fields').innerHTML=fields.map(([key,label,type,readonly,cls,options])=>{const val=state.editing[key]??'';const common=`name="${key}" ${readonly?'readonly':''}`;let control;if(type==='select')control=`<select ${common}>${options.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='textarea')control=`<textarea ${common}>${esc(val)}</textarea>`;else control=`<input type="${type}" ${common} value="${esc(type==='date'?String(val).slice(0,10):val)}">`;return `<label class="${cls||''}">${label}${control}</label>`;}).join('');document.getElementById('modal').classList.add('show');}
    function closeForm(){document.getElementById('modal').classList.remove('show');}
    async function save(e){e.preventDefault();const form=new FormData(e.target);const record=Object.fromEntries(form.entries());record.N_INTERNO=record.N_INTERNO?Number(record.N_INTERNO):'';record.MONTO_MENSUAL=record.MONTO_MENSUAL?Number(record.MONTO_MENSUAL):'';try{await api('save',{record});closeForm();await api('alerts');await loadApp();}catch(err){alert(err.message);}}
    async function removeRecord(id){if(!confirm('¿Dar de baja este alquiler? No se borra: queda en el historial.'))return;try{await api('delete',{id,observacion:'Baja solicitada desde el tablero'});await loadApp();}catch(err){alert(err.message);}}
    async function showHistory(id){try{const rows=await api('history',{id});const text=rows.length?rows.map(r=>`${r.FECHA_HORA} · ${r.OPERACION} · ${r.CAMPO}: ${r.VALOR_ANTERIOR||'—'} → ${r.VALOR_NUEVO||'—'}`).join('\n'):'Todavía no hay movimientos registrados.';alert(text);}catch(err){alert(err.message);}}
    function exportExcel(){const data=filtered();const cols=['ID_ALQUILER','N_EXPEDIENTE_RESOLUCION','SERVICIO','DOMICILIO','LOCADOR','FECHA_INICIO','FECHA_FIN','MONTO_MENSUAL','ESTADO_ADMINISTRATIVO','ESTADO_VIGENCIA','DOCUMENTACION'];const table=`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${data.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}</table>`;const blob=new Blob(['\ufeff<html><meta charset="utf-8">'+table+'</html>'],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='alquileres_siprosa_filtrados.xls';a.click();URL.revokeObjectURL(a.href);}
    loadApp();
  </script>
</body>
</html>
